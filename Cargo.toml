[package]
name = "snifferlauncher"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "snifferlauncher"
path = "src/main.rs"

[lib]
name = "snifferlauncher"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
devkit = []

[dependencies]
glow = "0.17.0"
glutin = "0.32.2"
glutin-winit = "0.5.0"
winit = "0.30.5"
swash = { version = "0.2.9", features = ["scale"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rquickjs = { version = "0.7", features = ["macro", "classes", "bindgen", "array-buffer"] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }
taffy = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
obfstr = "0.4"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = { version = "0.22.4" }
ndk-context = { version = "0.1.1" }
ndk = "0.9.0"
khronos-egl = { version = "6.0", features = ["dynamic"] }

[package.metadata.android]
package = "com.greenkod.snifferlauncher"
build_targets = ["aarch64-linux-android"]
assets = ".plugins"
resources = "android/res"
manifest = "android/AndroidManifest.xml"
aapt_ignore_assets = "!.svn:!.git:!.ds_store:!*.scc:.*:!_*:!_"

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
round_icon = "@mipmap/ic_launcher_round"
label = "Sniffer Launcher"

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 35
compile_sdk_version = 35

[package.metadata.android.signing.release]
path = "keystores/debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"

[profile.dev]
opt-level = 3
strip = true
lto = "fat"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

multiple_crate_versions = "allow"

[lints]
workspace = true

[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[package.metadata.android.application.activity]
launch_mode = "singleTask"
state_not_needed = "true"
clear_task_on_launch = "true"

[workspace]
exclude = [".plugins"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.HOME", "android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]