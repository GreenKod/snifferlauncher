[package]
name = "snifferlauncher"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "snifferlauncher"
path = "src/main.rs"

[lib]
name = "snifferlauncher"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
glow = "0.17.0"
sdl2 = "0.38.0"
fontdue = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = { version = "0.22.4" }
ndk-context = { version = "0.1.1" }
ndk = "0.9.0"
khronos-egl = { version = "6.0", features = ["dynamic"] }

[package.metadata.android]
package = "com.greenkod.snifferlauncher"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 35
compile_sdk_version = 35

[profile.dev]
opt-level = 3        # Fully optimize codes as in release mode
strip = true         # Clean symbols to reduce binary size
lto = true           # Enable Link-Time Optimization
panic = "abort"      # Abort on panic, not unwind

[profile.release]
opt-level = 3
strip = "symbols"    # 'true' yerine 'symbols' daha spesifik bir temizlik yapar
lto = "fat"          # 'true' yerine 'fat' daha agresif bir LTO sağlar
codegen-units = 1    # Derleme süresini uzatır ama kodu çok daha fazla optimize eder
panic = "abort"

[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"