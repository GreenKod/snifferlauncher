[package]
name = "snifferlauncher"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "snifferlauncher"
path = "src/main.rs"

[lib]
name = "snifferlauncher"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
glow = "0.17.0"
glutin = "0.32.2"
glutin-winit = "0.5.0"
winit = "0.30.5"
swash = { version = "0.2.9", features = ["scale"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rquickjs = { version = "0.7", features = ["macro", "classes", "bindgen", "array-buffer"] }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }
taffy = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
jni = { version = "0.22.4" }
ndk-context = { version = "0.1.1" }
ndk = "0.9.0"
khronos-egl = { version = "6.0", features = ["dynamic"] }

[package.metadata.android]
package = "com.greenkod.snifferlauncher"
build_targets = ["aarch64-linux-android"]
assets = ".plugins"

[package.metadata.android.sdk]
min_sdk_version = 30
target_sdk_version = 35
compile_sdk_version = 35

[profile.dev]
opt-level = 3        # Fully optimize codes as in release mode
strip = true         # Clean symbols to reduce binary size
lto = true           # Enable Link-Time Optimization
panic = "abort"      # Abort on panic, not unwind

[profile.release]
opt-level = 3
strip = "symbols"    # Using 'symbols' instead of 'true' provides more specific stripping
lto = "fat"          # Using 'fat' instead of 'true' provides more aggressive LTO
codegen-units = 1    # Increases compilation time but heavily optimizes the code
panic = "abort"

[workspace.lints.rust]
warnings = "deny" # Equivalent to -D warnings

[workspace.lints.clippy]
# Enable groups (priority = -1 prevents overriding individual allowances)
pedantic = { level = "deny", priority = -1 } # Equivalent to -D clippy::pedantic
nursery = { level = "deny", priority = -1 }  # Equivalent to -D clippy::nursery
cargo = { level = "deny", priority = -1 }    # Equivalent to -D clippy::cargo

# Specifically allowed rules
multiple_crate_versions = "allow"            # Equivalent to -A clippy::multiple-crate-versions

[lints]
workspace = true

[[package.metadata.android.uses_permission]]
name = "android.permission.QUERY_ALL_PACKAGES"

# Keep .plugins/ crates independent — they are separate plugin packages,
# not part of the main build graph.
[workspace]
exclude = [".plugins"]