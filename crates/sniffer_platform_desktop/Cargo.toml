[package]
name = "sniffer_platform_desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
sniffer_core = { path = "../sniffer_core", features = ["devkit"] }
sniffer_render = { path = "../sniffer_render" }
sniffer_plugin = { path = "../sniffer_plugin" }

winit = "0.30.5"
glutin = "0.32.2"
glutin-winit = "0.5.0"
glow = "0.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
obfstr = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
