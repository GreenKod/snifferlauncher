[package]
name = "sniffer_platform_desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
devkit = ["sniffer_core/devkit", "sniffer_plugin/devkit"]

[dependencies]
sniffer_core = { path = "../sniffer_core" }
sniffer_render = { path = "../sniffer_render" }
sniffer_plugin = { path = "../sniffer_plugin" }
sniffer_pkg = { path = "../sniffer_pkg" }
pkg_perfmon = { path = "../../packages/perf_monitor" }
pkg_scroll  = { path = "../../packages/scroll_view" }

winit = "0.30.5"
glutin = "0.32.2"
glutin-winit = "0.5.0"
glow = "0.18.0"
obfstr = "0.4"
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
