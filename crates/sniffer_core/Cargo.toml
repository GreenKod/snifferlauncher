[package]
name = "sniffer_core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
devkit = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
taffy = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
obfstr = "0.4"
swash = { version = "0.2.9", features = ["scale"] }

[lints]
workspace = true
