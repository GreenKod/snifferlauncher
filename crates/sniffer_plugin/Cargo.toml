[package]
name = "sniffer_plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
sniffer_core = { path = "../sniffer_core" }
rquickjs = { version = "0.7", features = ["macro", "classes", "bindgen", "array-buffer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
obfstr = "0.4"
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9.0"

[lints]
workspace = true
