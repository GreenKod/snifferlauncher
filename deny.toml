[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

[[licenses.clarify]]
name = "snifferlauncher"
expression = "Apache-2.0"
license-files = [
    { path = "LICENSE", hash = 0x0 }
]

[licenses.private]
ignore = false

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste crate is unmaintained, but wasmi depends on it
]

[bans]
multiple-versions = "warn" # Change to "deny" later if you can deduplicate all crates