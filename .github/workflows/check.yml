name: Rust Advanced Quality, Security, and Cross-Platform Check

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

# Principle of Least Privilege
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter Changed Files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths.yaml

  # ==========================================
  # STAGE 1: Quick Pre-flight Checks
  # ==========================================
  pre-flight:
    name: Quick Pre-flight Checks
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # If the repo security settings are disabled, this step will gracefully continue instead of failing.
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true 
        with:
          fail-on-severity: moderate

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Install and Run Typos
        run: |
          cargo install --locked typos-cli
          typos .

      # Optimize cargo-deny using the official action (Fast & No compilation)
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # Optimize cargo-audit using the official action (Fast & No compilation)
      - name: Run cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Install cargo-binstall from crates.io and run cargo-machete
      - name: Install cargo-binstall and Run cargo-machete
        run: |
          cargo install --locked cargo-binstall
          cargo binstall --no-confirm cargo-machete
          cargo machete

  # ==========================================
  # STAGE 2: Heavy Compilations & Platform Verifications
  # ==========================================
  
  # Linux (Desktop) Verification
  validate-linux:
    name: Linux Desktop Verification
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            cmake

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies and Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: linux-desktop

      - name: Syntax and Type Check (cargo check)
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Linter Analysis (cargo clippy)
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -A clippy::multiple-crate-versions

      - name: Linux Release Build Check
        run: cargo build --locked --release --workspace --all-features

  # Windows verification on a native runner with MSYS2
  validate-windows:
    name: Windows Verification
    runs-on: windows-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake

      - name: Setup Rust Toolchain and Windows Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: windows-msys2

      - name: Windows (GNU/64-bit) Check & Clippy
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          $msys2Root = "${{ steps.msys2.outputs.msys2-location }}"
          $mingwRoot = Join-Path $msys2Root "mingw64"
          if (-not (Test-Path "$mingwRoot\bin\x86_64-w64-mingw32-gcc.exe")) { throw "MINGW64 compiler not found under $mingwRoot" }
          $env:Path = "$mingwRoot\bin;$msys2Root\usr\bin;$env:Path"
          $env:PKG_CONFIG_PATH = "$mingwRoot\lib\pkgconfig;$env:PKG_CONFIG_PATH"
          cargo --version
          cargo check --locked --target x86_64-pc-windows-gnu
          cargo clippy --locked --workspace --all-targets --all-features --target x86_64-pc-windows-gnu -- -D warnings -D clippy::pedantic -D clippy::nursery -D clippy::cargo -A clippy::multiple-crate-versions

      - name: Windows Release Build Check
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          $msys2Root = "${{ steps.msys2.outputs.msys2-location }}"
          $mingwRoot = Join-Path $msys2Root "mingw64"
          if (-not (Test-Path "$mingwRoot\bin\x86_64-w64-mingw32-gcc.exe")) { throw "MINGW64 compiler not found under $mingwRoot" }
          $env:Path = "$mingwRoot\bin;$msys2Root\usr\bin;$env:Path"
          $env:PKG_CONFIG_PATH = "$mingwRoot\lib\pkgconfig;$env:PKG_CONFIG_PATH"
          cargo build --locked --release --target x86_64-pc-windows-gnu

  # macOS verification on native runners (Apple Silicon)
  validate-macos-aarch64:
    name: macOS Verification (Apple Silicon)
    runs-on: macos-14
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: brew install pkg-config

      - name: Setup Rust Toolchain and macOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: macOS (Apple Silicon) Check & Clippy
        run: |
          cargo check --locked --target aarch64-apple-darwin
          cargo clippy --locked --workspace --all-targets --all-features --target aarch64-apple-darwin -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -A clippy::multiple-crate-versions

      - name: macOS Release Build Check
        run: |
          cargo build --locked --release --target aarch64-apple-darwin

  # Android Compilation Verification
  validate-android:
    name: Android Verification (Multi-Architecture)
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Sets up the Android SDK on Linux
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Installs the NDK and dynamically writes ANDROID_NDK_HOME to GITHUB_ENV
      - name: Install NDK tool
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: android-linux

      # Install cargo-ndk directly from crates.io
      - name: Install cargo-ndk
        run: |
          cargo install --locked cargo-ndk

      # Performs checks using cargo-ndk.
      # ANDROID_NDK_HOME is automatically sourced from GITHUB_ENV.
      - name: Android (ARM64) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android30" cargo ndk --target aarch64-linux-android check

      - name: Android (ARMv7) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--target=armv7-linux-androideabi" cargo ndk --target armv7-linux-androideabi check

      - name: Android Clippy Checks
        run: |
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android30" cargo ndk --target aarch64-linux-android clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -A clippy::multiple-crate-versions
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--target=armv7-linux-androideabi" cargo ndk --target armv7-linux-androideabi clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -A clippy::multiple-crate-versions
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android" cargo ndk --target x86_64-linux-android clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -A clippy::multiple-crate-versions
          BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android="--target=i686-linux-android" cargo ndk --target i686-linux-android clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery \
            -D clippy::cargo \
            -A clippy::multiple-crate-versions

      - name: Android (Emulator x86_64) Check and Build
        run: |
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android" cargo ndk --target x86_64-linux-android check
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android" cargo ndk --target x86_64-linux-android build --release
