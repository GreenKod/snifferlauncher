name: Rust Advanced Quality, Security, and Cross-Platform Check

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths.yaml

  # ==========================================
  # STAGE 1: Quick Pre-flight Checks (Blazing Fast)
  # ==========================================
  pre-flight:
    name: Quick Pre-flight Checks
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: moderate

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Run Typos Spell Check
        uses: crate-ci/typos@master

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Run cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Run cargo-machete
        run: |
          cargo binstall --no-confirm cargo-machete
          cargo machete

  # ==========================================
  # STAGE 2: Platform Verifications
  # ==========================================

  # Linux (Desktop) Verification
  validate-linux:
    name: Linux Desktop Verification
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            cmake

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies and Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: linux-desktop

      - name: Linter Analysis (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests (cargo test)
        run: cargo test --locked --workspace --all-features

      - name: Linux Release Build Check
        run: cargo build --locked --release --workspace --all-features

  # Windows (Native MSVC) Verification
  validate-windows:
    name: Windows Native Verification
    runs-on: windows-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: windows-native

      - name: Windows Linter Analysis (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Windows Unit & Integration Tests (cargo test)
        run: cargo test --locked --workspace --all-features

      - name: Windows Release Build Check
        run: cargo build --locked --release --workspace --all-features

  # macOS verification on Apple Silicon
  validate-macos-aarch64:
    name: macOS Verification (Apple Silicon)
    runs-on: macos-14
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: brew install pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: macOS Linter Analysis (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --all-features --target aarch64-apple-darwin -- -D warnings

      - name: macOS Release Build Check
        run: cargo build --locked --release --target aarch64-apple-darwin

  # Android Compilation Verification
  validate-android:
    name: Android Multi-Architecture Verification
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK tool
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: android-linux

      - name: Install cargo-binstall and cargo-ndk
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-ndk binary
        run: cargo binstall --no-confirm cargo-ndk

      - name: Android (ARM64) Check & Clippy
        run: BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android30" cargo ndk --target aarch64-linux-android clippy --workspace --all-targets --all-features -- -D warnings

      - name: Android (ARMv7) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--target=armv7-linux-androideabi" cargo ndk --target armv7-linux-androideabi check

      - name: Android (Emulator x86_64) Check & Clippy
        run: BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android" cargo ndk --target x86_64-linux-android clippy --workspace --all-targets --all-features -- -D warnings

      - name: Android (x86 32-bit) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android="--target=i686-linux-android" cargo ndk --target i686-linux-android check

      - name: Android (ARM64) Release Build Check
        run: BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android30" cargo ndk --target aarch64-linux-android build --release
