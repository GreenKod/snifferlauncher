name: Rust Advanced Quality, Security, and Cross-Platform Check

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths.yaml

  # ==========================================
  # STAGE 1: Quick Pre-flight Checks (Parallel)
  # ==========================================
  pre-flight:
    name: Quick Pre-flight Checks
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependency 24h Quarantine & Supply-Chain Age Gate
        run: python3 .github/scripts/check_dependency_age.py

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: moderate

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Run Typos Spell Check
        uses: crate-ci/typos@v1

      - name: Run cargo-deny (Licenses & Advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Run cargo-machete (Unused Dependencies)
        run: |
          cargo binstall --no-confirm cargo-machete
          cargo machete

      - name: Plugin Manifest & JavaScript Syntax Tests
        run: cargo test --locked -p sniffer_plugin --test manifest_validation_tests

      - name: Fast Workspace Compilation Sanity Check
        run: cargo check --locked --workspace

  # ==========================================
  # STAGE 2: Parallel Platform Verifications
  # ==========================================

  # Linux (Desktop) Verification & Visual Smoke Test
  validate-linux:
    name: Linux Desktop & Visual Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1-mesa-dri \
            libgl1-mesa-dev \
            mesa-utils \
            libgtk-3-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            cmake

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies and Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: linux-desktop

      - name: Linter Analysis - Default Features (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Linter Analysis - DevKit Feature (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --features devkit -- -D warnings

      - name: Minimal Compilation Check (No Default Features)
        run: cargo check --locked --workspace --no-default-features

      - name: Run Unit & Integration Tests (cargo test)
        run: cargo test --locked --workspace --all-features

      - name: Linux Release Build
        run: cargo build --locked --release --workspace

      - name: Linux Desktop Visual Smoke Test (Xvfb)
        run: |
          timeout 60s xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24 +extension GLX" env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe MESA_GL_VERSION_OVERRIDE=3.3 SNIFFER_SMOKE_TEST_FRAMES=15 SNIFFER_SCREENSHOT_PATH=desktop_screenshot.png target/release/snifferlauncher-desktop

      - name: Upload Desktop Smoke Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-visual-smoke
          path: desktop_screenshot.png
          if-no-files-found: warn

      - name: Upload Linux Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-binary
          path: target/release/snifferlauncher-desktop
          if-no-files-found: warn

  # Windows (Native MSVC) Verification
  validate-windows:
    name: Windows Native Verification
    runs-on: windows-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: windows-native

      - name: Windows Linter Analysis - Default Features (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Windows Linter Analysis - DevKit Feature (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --features devkit -- -D warnings

      - name: Windows Unit & Integration Tests (cargo test)
        run: cargo test --locked --workspace --all-features

      - name: Windows Release Build Check
        run: cargo build --locked --release --workspace

      - name: Upload Windows Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-binary
          path: target/release/snifferlauncher-desktop.exe
          if-no-files-found: warn

  # macOS verification on Apple Silicon
  validate-macos-aarch64:
    name: macOS Verification (Apple Silicon)
    runs-on: macos-14
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: brew install pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: macOS Linter Analysis (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: macOS Release Build Check
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: macOS Desktop Visual Smoke Test
        timeout-minutes: 3
        run: |
          env SNIFFER_SMOKE_TEST_FRAMES=15 SNIFFER_SCREENSHOT_PATH=macos_screenshot.png target/aarch64-apple-darwin/release/snifferlauncher-desktop

      - name: Upload macOS Smoke Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-visual-smoke
          path: macos_screenshot.png
          if-no-files-found: warn

      - name: Upload macOS Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-binary
          path: target/aarch64-apple-darwin/release/snifferlauncher-desktop
          if-no-files-found: warn

  # Android Compilation & Real APK Packaging Verification
  validate-android:
    name: Android Packaging (cargo-apk & cargo-ndk)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Build-Tools and NDK
        run: |
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: android-linux

      - name: Install cargo-binstall and cargo-ndk
        uses: cargo-bins/cargo-binstall@main

      - name: Install Android Cargo Tools
        run: |
          cargo binstall --no-confirm cargo-ndk
          cargo install --locked cargo-apk

      - name: Android (ARM64) Check & Clippy
        run: BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android30" cargo ndk --target aarch64-linux-android clippy --workspace --all-targets -- -D warnings

      - name: Android (ARMv7) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--target=armv7-linux-androideabi" cargo ndk --target armv7-linux-androideabi check

      - name: Android (Emulator x86_64) Check & Clippy
        run: BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android" cargo ndk --target x86_64-linux-android clippy --workspace --all-targets -- -D warnings

      - name: Android (x86 32-bit) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android="--target=i686-linux-android" cargo ndk --target i686-linux-android check

      - name: Generate CI Keystore
        run: |
          mkdir -p keystores
          keytool -genkey -v -keystore keystores/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android ARM64 Release APK
        run: |
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-android30 --sysroot=$SYSROOT" cargo apk build --target aarch64-linux-android --lib --release

      - name: Build Android Emulator x86_64 Release APK
        run: |
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          BINDGEN_EXTRA_CLANG_ARGS="--target=x86_64-linux-android30 --sysroot=$SYSROOT" cargo apk build --target x86_64-linux-android --lib --release

      - name: Upload Android Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: target/**/*.apk
          if-no-files-found: warn

  # ==========================================
  # STAGE 3: Android Emulator Smoke Test (Visual)
  # ==========================================
  android-emulator-smoke:
    name: Android Emulator Visual Smoke Test
    runs-on: ubuntu-latest
    needs: [changes, validate-android]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Release APKs
        uses: actions/download-artifact@v4
        with:
          name: android-release-apks
          path: apks

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Run Android Emulator and Capture Screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android_smoke_test.sh

      - name: Upload Android Smoke Screenshot & Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-visual-smoke
          path: |
            android_screen.png
            logcat_snippet.txt
          if-no-files-found: warn

  # ==========================================
  # STAGE 4: Security & VirusTotal Artifact Scanning
  # ==========================================
  security-scan-artifacts:
    name: VirusTotal & Artifact Security Scan
    runs-on: ubuntu-latest
    needs: [changes, validate-linux, validate-windows, validate-macos-aarch64, validate-android]
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true') && always()
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    env:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Desktop Binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-desktop-binary
          path: scan_artifacts/windows

      - name: Download Linux Desktop Binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-desktop-binary
          path: scan_artifacts/linux

      - name: Download macOS Desktop Binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-desktop-binary
          path: scan_artifacts/macos

      - name: Download Android Release APKs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-release-apks
          path: scan_artifacts/android

      - name: List Artifacts for Scanning
        run: |
          echo "### 📦 Artifacts Prepared for Security Analysis" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          find scan_artifacts -type f -exec ls -lh {} + 2>/dev/null | awk '{print "| `" $9 "` | " $5 " |"}' >> $GITHUB_STEP_SUMMARY || echo "No artifacts found."

      - name: Scan Artifacts with VirusTotal
        uses: crazy-max/ghaction-virustotal@v4
        if: env.VIRUSTOTAL_API_KEY != ''
        with:
          vt_api_key: ${{ env.VIRUSTOTAL_API_KEY }}
          files: |
            scan_artifacts/**/*.exe
            scan_artifacts/**/snifferlauncher-desktop
            scan_artifacts/**/*.apk
          request_rate: 4

      - name: VirusTotal Scan Notice (Skipped)
        if: env.VIRUSTOTAL_API_KEY == ''
        run: |
          echo "::warning title=VirusTotal Scan Skipped::VIRUSTOTAL_API_KEY secret is not configured in repository settings. Artifact malware scanning was skipped. To activate automated binary scanning, add VIRUSTOTAL_API_KEY to Repository Secrets."
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ VirusTotal Taraması Atlandı" >> $GITHUB_STEP_SUMMARY
          echo "> **Uyarı:** \`VIRUSTOTAL_API_KEY\` gizli anahtarı tanımlanmadığı için ikili dosya ve APK taraması atlandı." >> $GITHUB_STEP_SUMMARY
          echo "> Otomatik antivirüs taramasını aktif etmek için GitHub reponuzda **Settings > Secrets and variables > Actions** sekmesine giderek anahtarınızı ekleyebilirsiniz." >> $GITHUB_STEP_SUMMARY
