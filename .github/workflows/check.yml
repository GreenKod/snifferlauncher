name: Rust Advanced Quality, Security, and Cross-Platform Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Principle of Least Privilege
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ==========================================
  # STAGE 1: Quick Pre-flight Checks
  # ==========================================
  pre-flight:
    name: Quick Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # If the repo security settings are disabled, this step will gracefully continue instead of failing.
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true 
        with:
          fail-on-severity: moderate

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Scan for Typos
        uses: crate-ci/typos@master

      # Safely install and run cargo-deny from crates.io
      - name: Install and Run cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      # Safely install and run cargo-audit from crates.io
      - name: Install and Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # Safely install and run cargo-machete to detect unused dependencies
      - name: Detect Unused Dependencies (cargo-machete)
        run: |
          cargo install cargo-machete --locked
          cargo machete

  # ==========================================
  # STAGE 2: Heavy Compilations & Platform Verifications
  # ==========================================
  
  # Linux (Desktop) Verification
  validate-linux:
    name: Linux Desktop Verification
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libsdl2-dev \
            cmake

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies and Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: linux-desktop

      - name: Syntax and Type Check (cargo check)
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Linter Analysis (cargo clippy)
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::pedantic \
            -D clippy::nursery

      - name: Linux Release Build Check
        run: cargo build --locked --release --workspace --all-features

  # Windows Cross-Compilation Verification (via MinGW on Linux)
  validate-windows-via-mingw:
    name: Windows Verification (via MinGW on Linux)
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MinGW, SDL2 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 mingw-w64-x86-64-sdl2-dev pkg-config cmake

      - name: Setup Rust Toolchain and Windows Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: windows-mingw

      # The "bundled" feature in Cargo.toml will automatically build the SDL2 library.
      - name: Windows (GNU/64-bit) Check & Clippy
        run: |
          cargo check --locked --target x86_64-pc-windows-gnu
          cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings

      - name: Windows Release Build Check
        run: cargo build --locked --release --target x86_64-pc-windows-gnu

  # macOS Cross-Compilation Verification (via osxcross on Linux)
  validate-macos-via-osxcross:
    name: macOS Verification (via osxcross on Linux)
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev libxml2-dev uuid-dev libssl-dev bash patch make tar xz-utils cmake git fts-dev

      # Configures macOS SDK on Linux using osxcross
      - name: Setup osxcross Toolchain
        uses: namse/setup-osxcross@v1.0.8
        with:
          osx-version: "12.3"

      - name: Setup Rust Toolchain and macOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: osxcross-linux

      # The "bundled" feature will build SDL2 for macOS using the osxcross compiler.
      # Explicitly specify target-specific linkers to avoid toolchain conflicts.
      - name: macOS (Intel) Check & Clippy
        env:
          CC: o64-clang
          CXX: o64-clang++
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: o64-clang
        run: |
          cargo check --locked --target x86_64-apple-darwin
          cargo clippy --locked --target x86_64-apple-darwin -- -D warnings

      - name: macOS (Apple Silicon M1/M2/M3) Check & Clippy
        env:
          CC: oaarch64-clang
          CXX: oaarch64-clang++
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: oaarch64-clang
        run: |
          cargo check --locked --target aarch64-apple-darwin
          cargo clippy --locked --target aarch64-apple-darwin -- -D warnings

      - name: macOS Release Build Check
        env:
          CC: oaarch64-clang
          CXX: oaarch64-clang++
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: oaarch64-clang
        run: |
          cargo build --locked --release --target aarch64-apple-darwin

  # Android Compilation Verification
  validate-android:
    name: Android Verification (Multi-Architecture)
    runs-on: ubuntu-latest
    needs: pre-flight
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Sets up the Android SDK on Linux
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Installs the NDK and dynamically writes ANDROID_NDK_HOME to GITHUB_ENV
      - name: Install NDK tool
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: android-linux

      # Installs cargo-ndk to allow "bundled" C/C++ cross-compilation (like SDL2) for Android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Performs checks using cargo-ndk.
      # ANDROID_NDK_HOME is automatically sourced from GITHUB_ENV.
      - name: Android (ARM64) Check
        run: cargo ndk --target aarch64-linux-android check

      - name: Android (ARMv7) Check
        run: cargo ndk --target armv7-linux-androideabi check

      - name: Android (Emulator x86_64) Check and Build
        run: |
          cargo ndk --target x86_64-linux-android check
          cargo ndk --target x86_64-linux-android build --release