name: Rust Advanced Quality, Security, and Cross-Platform Check

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/paths.yaml

  # ==========================================
  # STAGE 1: Quick Pre-flight Checks (Parallel)
  # ==========================================
  pre-flight:
    name: Quick Pre-flight Checks
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: moderate

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Run Typos Spell Check
        uses: crate-ci/typos@v1

      - name: Run cargo-deny (Licenses & Advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Run cargo-machete (Unused Dependencies)
        run: |
          cargo binstall --no-confirm cargo-machete
          cargo machete

      - name: Plugin Manifest & JavaScript Syntax Tests
        run: cargo test --locked -p sniffer_plugin --test manifest_validation_tests

      - name: Fast Workspace Compilation Sanity Check
        run: cargo check --locked --workspace

  # ==========================================
  # STAGE 2: Parallel Platform Verifications
  # ==========================================

  # Linux (Desktop) Verification & Visual Smoke Test
  validate-linux:
    name: Linux Desktop & Visual Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            cmake

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Cache Dependencies and Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          key: linux-desktop

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Linter Analysis - Default Features (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Linter Analysis - DevKit Feature (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --features devkit -- -D warnings

      - name: Minimal Compilation Check (No Default Features)
        run: cargo check --locked --workspace --no-default-features

      - name: Run Unit & Integration Tests with Coverage
        run: |
          cargo llvm-cov --locked --workspace --all-features --summary-only >> $GITHUB_STEP_SUMMARY

      - name: Linux Release Build
        run: cargo build --locked --release --workspace

      - name: Linux Desktop Visual Smoke Test (Xvfb)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" env SNIFFER_SMOKE_TEST_FRAMES=15 SNIFFER_SCREENSHOT_PATH=desktop_screenshot.png target/release/snifferlauncher-desktop

      - name: Upload Desktop Smoke Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-visual-smoke
          path: desktop_screenshot.png
          if-no-files-found: warn

      - name: Upload Linux Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-binary
          path: target/release/snifferlauncher-desktop
          if-no-files-found: warn

  # Windows (Native MSVC) Verification
  validate-windows:
    name: Windows Native Verification
    runs-on: windows-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: windows-native

      - name: Windows Linter Analysis - Default Features (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Windows Linter Analysis - DevKit Feature (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --features devkit -- -D warnings

      - name: Windows Unit & Integration Tests (cargo test)
        run: cargo test --locked --workspace --all-features

      - name: Windows Release Build Check
        run: cargo build --locked --release --workspace

      - name: Upload Windows Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-binary
          path: target/release/snifferlauncher-desktop.exe
          if-no-files-found: warn

  # macOS verification on Apple Silicon (Optimized: Master / PR to master / Dispatch only)
  validate-macos-aarch64:
    name: macOS Verification (Apple Silicon)
    runs-on: macos-14
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'master') || github.ref == 'refs/heads/master') && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: brew install pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: macOS Linter Analysis (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

      - name: macOS Release Build Check
        run: cargo build --locked --release --target aarch64-apple-darwin

  # Android Compilation & Real APK Packaging Verification
  validate-android:
    name: Android Packaging (cargo-apk & cargo-ndk)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK tool
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
          components: clippy

      - name: Cache Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: android-linux

      - name: Install cargo-binstall, cargo-ndk and cargo-apk
        uses: cargo-bins/cargo-binstall@main

      - name: Install Android Cargo Tools
        run: cargo binstall --no-confirm cargo-ndk cargo-apk

      - name: Android (ARM64) Check & Clippy
        run: BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android30" cargo ndk --target aarch64-linux-android clippy --workspace --all-targets -- -D warnings

      - name: Android (ARMv7) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--target=armv7-linux-androideabi" cargo ndk --target armv7-linux-androideabi check

      - name: Android (Emulator x86_64) Check & Clippy
        run: BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android" cargo ndk --target x86_64-linux-android clippy --workspace --all-targets -- -D warnings

      - name: Android (x86 32-bit) Check
        run: BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android="--target=i686-linux-android" cargo ndk --target i686-linux-android check

      - name: Build Android ARM64 Release APK
        run: cargo apk build --target aarch64-linux-android --release

      - name: Build Android Emulator x86_64 Release APK
        run: cargo apk build --target x86_64-linux-android --release

      - name: Upload Android Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: target/**/*.apk
          if-no-files-found: warn

  # ==========================================
  # STAGE 3: Android Emulator Smoke Test (Visual)
  # ==========================================
  android-emulator-smoke:
    name: Android Emulator Visual Smoke Test
    runs-on: ubuntu-latest
    needs: [changes, validate-android]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'master') || github.ref == 'refs/heads/master'
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Release APKs
        uses: actions/download-artifact@v4
        with:
          name: android-release-apks
          path: apks

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Emulator and Capture Screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            APK_FILE=$(find apks -name "*x86_64*.apk" -o -name "*.apk" | head -n 1)
            echo "Found APK to test: $APK_FILE"
            if [ -n "$APK_FILE" ]; then
              adb install "$APK_FILE"
              adb shell am start -n com.sniffer.launcher/android.app.NativeActivity
              sleep 6
              adb exec-out screencap -p > android_screen.png
            else
              echo "No APK found to install"
            fi

      - name: Upload Android Smoke Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-visual-smoke
          path: android_screen.png
          if-no-files-found: warn
