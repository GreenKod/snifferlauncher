# ==============================================================================
# SnifferLauncher Path Filters (Inverse / Ignore-List Strategy)
# ==============================================================================
# Triggers CI for ANY change across the entire codebase EXCEPT documentation,
# licenses, and non-executable metadata.
# ==============================================================================

rust:
  - '!**/*.md'
  - '!LICENSE*'
  - '!.gitignore'
  - '!_typos.toml'
