# ==============================================================================
# SnifferLauncher Path Filters
# ==============================================================================
# Maps file paths to category outputs for selective CI execution.
# ==============================================================================

source:
  - 'src/**'
  - 'tests/**'
  - 'android/**'
  - '.plugins/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'deny.toml'
  - '_typos.toml'

ci:
  - '.github/**'
  - 'scripts/**'

docs:
  - '**/*.md'
  - 'LICENSE*'
  - '!.gitignore'
