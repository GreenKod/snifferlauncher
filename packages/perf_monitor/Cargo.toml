[package]
name = "pkg_perfmon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "pkg_perfmon"
crate-type = ["rlib", "cdylib"]

[dependencies]
sniffer_core = { path = "../../crates/sniffer_core" }
sniffer_pkg  = { path = "../../crates/sniffer_pkg", features = ["pkg_perfmon"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"

[lints]
workspace = true
